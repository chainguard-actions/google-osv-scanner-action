name: Test scan of directory with no package manifests
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean directory with no package manifests
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/empty-dir"
          echo "# Just a readme" > "$GITHUB_WORKSPACE/tests/fixtures/empty-dir/README.md"

      - id: scan
        name: Run OSV scanner on clean directory
        uses: .
        with:
          scan-args: |-
            --recursive
            ./tests/fixtures/empty-dir
        continue-on-error: true

      - name: Assert scanner succeeded (no vulnerabilities in clean dir)
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: scanner found no vulnerabilities in clean directory"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: scanner ran (may report no lockfiles found, which is acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
