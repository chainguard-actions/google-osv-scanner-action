name: Test OSV scanner with custom scan args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal requirements.txt for scanning
        run: |
          mkdir -p tests/fixtures/python-target
          cat > tests/fixtures/python-target/requirements.txt << 'EOF'
          requests==2.28.2
          EOF

      - id: scan
        uses: .
        with:
          scan-args: |-
            --lockfile=tests/fixtures/python-target/requirements.txt
        continue-on-error: true

      - name: Assert scanner ran with custom args
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: scanner ran successfully with custom args"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: scanner ran with custom args and found vulnerabilities"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
