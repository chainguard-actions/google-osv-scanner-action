name: Test custom scan-args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: scan
        name: Run OSV scanner with custom args pointing at tests directory
        uses: .
        with:
          scan-args: |-
            --recursive
            ./tests
        continue-on-error: true

      - name: Assert scanner ran with custom args
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: scanner ran with custom scan-args (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' — scanner did not run properly"
            exit 1
          fi
