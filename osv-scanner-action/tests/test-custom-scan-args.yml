name: Test custom scan-args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create an empty directory to scan (no lockfiles, no vulnerabilities)
        run: mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/empty-scan-target"

      - name: Run OSV scanner with custom scan-args pointing to empty directory
        id: scan
        uses: .
        with:
          scan-args: |-
            --recursive
            ./tests/fixtures/empty-scan-target
        continue-on-error: true

      - name: Assert scanner ran with custom args
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: OSV scanner completed successfully on empty directory (no vulnerabilities)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: OSV scanner ran and reported an outcome (may have found issues or scan error)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' — scanner did not run properly"
            exit 1
          fi
