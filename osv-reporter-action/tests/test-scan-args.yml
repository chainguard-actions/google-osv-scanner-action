name: Test osv-scanner-reporter with explicit scan-args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Set up a git origin reachable inside the Docker container
      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      # Scan with --skip-git to avoid git-related failures inside the container,
      # targeting only the tests directory which is small and known.
      # The scanner may exit non-zero if it finds vulnerabilities or no lockfiles.
      - id: action
        uses: .
        continue-on-error: true
        with:
          scan-args: |-
            --skip-git
            --recursive
            tests/

      - name: Assert action ran (success or graceful failure on no lockfiles/vulns)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: scanner completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: scanner ran and exited non-zero (vulnerabilities found or no lockfiles — expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
