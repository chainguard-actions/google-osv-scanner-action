name: Test osv-scanner-reporter with invalid arguments
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Pass an unknown flag to verify the action fails gracefully with bad input
      - id: action
        uses: .
        continue-on-error: true
        with:
          scan-args: |-
            --this-flag-does-not-exist

      - name: Assert action failed gracefully on invalid args
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed on invalid arguments"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran (some versions may ignore unknown flags)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
