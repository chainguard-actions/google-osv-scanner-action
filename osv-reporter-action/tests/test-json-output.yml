name: Test JSON output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a minimal lockfile for scanning
        run: |
          cat > "$GITHUB_WORKSPACE/package-lock.json" << 'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "lockfileVersion": 2,
            "requires": true,
            "packages": {}
          }
          EOF

      - id: scan
        uses: .
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --skip-git
            --lockfile=package-lock.json

      - name: Assert action ran with JSON format (success or graceful failure)
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: scanner completed successfully with JSON format"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: scanner ran and reported findings in JSON format (non-zero exit expected when vulnerabilities found)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' — expected success or failure"
            exit 1
          fi
