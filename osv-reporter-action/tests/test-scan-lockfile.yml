# Test osv-scanner-reporter action scanning a specific lockfile fixture.
# Uses a minimal requirements.txt fixture. The action may succeed (no vulns)
# or fail (vulns found) — both are valid outcomes.
name: Test scan lockfile
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal requirements.txt fixture for scanning
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/scan-target"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/scan-target/requirements.txt" <<'EOF'
          requests==2.28.2
          EOF

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: scan
        uses: .
        continue-on-error: true
        with:
          scan-args: |-
            --lockfile
            /github/workspace/tests/fixtures/scan-target/requirements.txt

      - name: Assert action ran (success or failure due to vulns, not a crash)
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: scan completed with no vulnerabilities found"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: scan completed (vulnerabilities found — expected outcome)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
