name: Test basic usage of osv-reporter action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal scan result file for osv-reporter
        run: |
          mkdir -p "$GITHUB_WORKSPACE/scan-results"
          cat > "$GITHUB_WORKSPACE/scan-results/results.json" <<'EOF'
          {
            "results": []
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          scan-args: |-
            --json
            --output=${{ github.workspace }}/scan-results/output.json
            ${{ github.workspace }}/scan-results/results.json

      - name: Assert action ran with scan-args input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected for reporter with minimal/empty scan results)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
