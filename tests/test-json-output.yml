name: Test osv-scanner-action with JSON output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a clean directory with no lock files to scan
      - name: Create clean scan target directory
        run: |
          mkdir -p /tmp/json-scan-target
          echo "# Test project" > /tmp/json-scan-target/README.md

      - name: Run osv-scanner-action with JSON output
        id: scanner
        uses: ./osv-scanner-action
        with:
          scan-args: |-
            --format
            json
            --recursive
            /tmp/json-scan-target
        continue-on-error: true

      - name: Assert scanner ran with JSON output format
        env:
          OUTCOME: ${{ steps.scanner.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: scanner completed successfully with JSON output format"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: scanner ran and reported findings (acceptable outcome)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
