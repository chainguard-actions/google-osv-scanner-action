name: Test osv-scanner-action with custom scan-args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: scan
        name: Run osv-scanner-action with custom args (scan tests dir only)
        uses: ./osv-scanner-action
        with:
          scan-args: |-
            --recursive
            ./tests
        continue-on-error: true
      - name: Assert scanner ran with custom args
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: scanner ran and found no vulnerabilities in tests directory"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: scanner ran and reported an issue (non-zero exit is expected behavior for a scanner)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' — scanner may not have run at all"
            exit 1
          fi
