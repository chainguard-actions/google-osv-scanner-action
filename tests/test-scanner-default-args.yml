name: Test osv-scanner-action with default scan args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal requirements.txt with no packages so the scanner finds no vulnerabilities
      - name: Create fixture with empty requirements.txt
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/empty-deps"
          # Empty requirements.txt - no packages, no vulnerabilities
          touch "$GITHUB_WORKSPACE/tests/fixtures/empty-deps/requirements.txt"

      - name: Run osv-scanner with default args on fixture directory
        id: scanner
        uses: ./osv-scanner-action
        with:
          scan-args: |-
            --recursive
            ./tests/fixtures/empty-deps
        continue-on-error: true

      - name: Assert scanner succeeded with no vulnerabilities
        env:
          OUTCOME: ${{ steps.scanner.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success scanning empty requirements.txt, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: scanner found no vulnerabilities in empty deps"
