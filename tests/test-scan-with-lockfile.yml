name: Test scan with lockfile fixture
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a requirements.txt with a known package for scanning
      - name: Create fixture lockfile
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/python-project"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/python-project/requirements.txt" << 'EOF'
          requests==2.32.3
          EOF

      - id: scan
        uses: ./osv-scanner-action
        with:
          scan-args: |-
            --lockfile=requirements.txt:./tests/fixtures/python-project/requirements.txt
        continue-on-error: true

      - name: Assert scan ran
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The scanner exits 0 if no vulnerabilities, non-zero if vulnerabilities found
          # Both are valid outcomes for this test — we just verify the action ran
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: osv-scanner ran and produced a result (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
