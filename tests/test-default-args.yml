name: Test OSV scan with explicit default scan-args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run OSV scanner with explicit default scan-args
        id: scan
        uses: ./osv-scanner-action
        with:
          scan-args: |-
            --recursive
            ./
        continue-on-error: true

      - name: Assert scanner ran without infrastructure error
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          echo "scan outcome: $OUTCOME"
          # success = no vulnerabilities found (exit 0)
          # failure = vulnerabilities found (exit 1) — both are valid scanner outcomes
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: scanner completed with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' — expected 'success' or 'failure'"
            exit 1
          fi
