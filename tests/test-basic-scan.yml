name: Test basic scan (root action)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The root action.yml is a metadata-only wrapper with no inputs/outputs.
      # It simply describes the osv-scanner action family.
      # We verify it can be referenced without error.
      - id: action
        uses: .
        continue-on-error: true

      - name: Assert action was invoked
        run: |
          echo "Root action invoked successfully (no inputs/outputs defined)"
          echo "PASS"
