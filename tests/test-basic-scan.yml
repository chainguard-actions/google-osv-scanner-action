name: Test osv-scanner-action basic scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a clean temp directory with no lock files to scan
      - name: Create clean scan target directory
        run: |
          mkdir -p /tmp/clean-scan-target
          echo "# Hello World" > /tmp/clean-scan-target/README.md

      - name: Run osv-scanner-action on clean directory
        id: scanner
        uses: ./osv-scanner-action
        with:
          scan-args: |-
            --recursive
            /tmp/clean-scan-target
        continue-on-error: true

      - name: Assert scanner ran (no lock files means no vulnerabilities)
        env:
          OUTCOME: ${{ steps.scanner.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: scanner completed successfully (no vulnerabilities found)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: scanner ran and reported findings (acceptable outcome)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
